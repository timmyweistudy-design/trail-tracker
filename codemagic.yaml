# Codemagic 雲端建置設定（不用自己有 Mac 就能出 iOS；也能雲端出 Android APK）
# 用法：到 https://codemagic.io → 用 GitHub 登入 → 選這個 repo → 它會自動讀這個檔。
# 需要在 Codemagic 後台先設定的東西見每個 workflow 的註解。
#
# 兩個工作流程：
#   ios-capacitor      → 出 iOS，上傳 TestFlight/App Store（需 Apple Developer 帳號）
#   android-capacitor  → 出 Android APK，可直接下載安裝（不需任何帳號、不需 Android Studio）

workflows:

  # ── iOS ──────────────────────────────────────────────
  ios-capacitor:
    name: 循徑拾光 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # 在 Codemagic：Teams ▸ Integrations ▸ App Store Connect 加一把 API Key，
      # 名稱填在下面（例如 "TrailTracker ASC"）。需要 Apple Developer Program（US$99/年）。
      app_store_connect: TrailTracker ASC
    environment:
      groups:
        - signing            # CERTIFICATE_PRIVATE_KEY 存在這個變數群組裡；不引用就不會被注入 build
      node: 20
      xcode: latest
      cocoapods: default
      # ⚠️ 不用宣告式 ios_signing block：全新帳號什麼憑證/描述檔都沒有，宣告式那套會在
      #    build 初始化時先 fetch（不會 create）就失敗，也跑不到下面的手動步驟。
      #    改用 Codemagic 官方對「全新帳號」的完整手動簽章流程（憑證＋描述檔一次全自動建立）。
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.timmyweistudy.trailtracker"
    scripts:
      - name: 安裝 npm 依賴
        script: npm install
      - name: Capacitor 同步 iOS（複製最新 web/ + 外掛）
        script: npx cap sync ios
      - name: pod install
        script: |
          cd ios/App
          pod install
      - name: 初始化 keychain
        script: keychain initialize
      - name: 抓取／自動建立 App Store 憑證＋描述檔
        # --certificate-key：建立 distribution 憑證需要一把 RSA 私鑰來簽發。缺這把就會報
        # "Cannot save Signing Certificates without certificate private key"（就是先前一直卡的錯）。
        # 這把 key 存在 Codemagic 環境變數 CERTIFICATE_PRIVATE_KEY（加密）。
        # 用固定 key → 每次建置都重用同一張憑證，不會累積（Apple distribution 憑證上限 2 張）。
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: 憑證加入 keychain（build-ipa 才簽得了）
        script: keychain add-certificates
      - name: 套用簽章描述檔到 Xcode 專案
        script: xcode-project use-profiles
      - name: 編譯 IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # 編好自動上傳 TestFlight（你手機就能裝來測）；要正式上架再從 App Store Connect 送審
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - gatherthetrail@gmail.com

  # ── Android（免帳號，出可直接安裝的 APK）────────────────
  android-capacitor:
    name: 循徑拾光 Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 20
      java: 17
    scripts:
      - name: 安裝 npm 依賴
        script: npm install
      - name: Capacitor 同步 Android
        script: npx cap sync android
      - name: 編譯 Debug APK（可直接裝）
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - gatherthetrail@gmail.com   # 建置完成把 APK 寄到信箱，下載裝到手機即可
